repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: strip-cursor-coauthor
        name: strip Cursor co-author from commit message
        entry: scripts/git-hooks/commit-msg
        language: script
        stages: [commit-msg]
        pass_filenames: true

      - id: basedpyright
        name: basedpyright (strict, warnings fail)
        entry: uv run basedpyright --warnings src/django_grid_view tests
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
