repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff (fix)
        entry: uv run ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: strip-cursor-coauthor
        name: strip Cursor co-author from commit message
        entry: scripts/git-hooks/commit-msg
        language: script
        stages: [commit-msg]
        pass_filenames: true

      - id: basedpyright
        name: basedpyright (strict, warnings fail)
        entry: uv run basedpyright --warnings src/grid_view_spec tests
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-typecheck
        name: frontend TypeScript typecheck
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-eslint
        name: frontend ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
