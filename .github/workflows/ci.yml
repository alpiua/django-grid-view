name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright --warnings src/django_grid_view tests
      - run: uv run python -m pytest

  docs:
    name: Docs and LLM context bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/build_llm_context.py
      - name: Verify committed LLM bundle matches generator
        run: git diff --exit-code docs/llm/django-grid-view-llm-context.md
      - run: uv run mkdocs build --strict
      - name: Verify downloadable bundle in site output
        run: test -f site/llm/django-grid-view-llm-context.md

  build-js:
    name: Build frontend (TypeScript → static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run test:conformance --prefix frontend
      - run: npm run test:chart-conformance --prefix frontend
      - name: Verify committed static artifacts match build
        run: git diff --exit-code src/django_grid_view/static/

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, docs, build-js]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv build
      - run: uv run --with twine python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
