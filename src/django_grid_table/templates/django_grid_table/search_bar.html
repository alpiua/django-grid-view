{% load i18n %}
<div class="relative flex-1 flex items-center gap-2 group">
    <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-[--cm-muted] pointer-events-none group-focus-within:text-indigo-500 transition-colors" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="ag-quick-filter-{{ grid_id }}"
            class="w-full bg-[--cm-bg] border border-[--cm-border] text-[--cm-text] pl-9 pr-10 py-1.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all placeholder:text-[--cm-muted]"
            placeholder="{% trans "Smart search: ',' to combine, '-' to exclude, ';' for OR" %}" oninput="{{ grid_id }}Manager.onQuickFilterChanged()">
        <button onclick="{{ grid_id }}Manager.clearSearch()" title="{% trans 'Clear search' %}" class="absolute right-1 top-1/2 -translate-y-1/2 p-1 text-[--cm-muted] hover:text-red-500 transition-colors rounded hover:bg-[--cm-hover]"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></button>
    </div>
    
    <div class="flex items-center gap-1 shrink-0">
        <button onclick="{{ grid_id }}Manager.saveCurrentSearch()" title="{% trans 'Save current search' %}"
            class="flex items-center justify-center text-[--cm-muted] hover:text-emerald-500 bg-[--cm-bg] border border-[--cm-border] hover:border-emerald-500 transition-colors rounded-lg w-8 h-8 shadow-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        
        <div class="relative pointer-events-auto select-none hidden" id="saved-searches-toggle-container-{{ grid_id }}">
            <button onclick="{{ grid_id }}Manager.toggleSavedSearches()" id="saved-searches-btn-{{ grid_id }}" title="{% trans 'Saved queries' %}"
                class="flex items-center justify-center text-[--cm-muted] hover:text-indigo-400 bg-[--cm-bg] border border-[--cm-border] hover:border-indigo-500 transition-colors rounded-lg w-8 h-8 shadow-sm">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <div id="saved-searches-dropdown-{{ grid_id }}" class="hidden absolute top-[calc(100%+8px)] right-0 w-80 bg-[--cm-surface] border border-[--cm-border] rounded-lg shadow-xl z-50 overflow-hidden">
                <div class="px-3 py-1.5 text-[10px] uppercase tracking-widest text-[--cm-muted] font-bold border-b border-[--cm-border]">{% trans 'Saved searches' %}</div>
                <div id="saved-searches-container-{{ grid_id }}" class="flex flex-col py-1 max-h-[200px] overflow-y-auto w-full"></div>
            </div>
        </div>
    </div>
</div>
