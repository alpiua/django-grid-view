{% load i18n %}
<script>
window.ContextGridSmartFilter = class {
    init(params) {
        this.params = params;
        this.field = params.colDef.field;
        this.selectedValues = new Set();
        this.allValues = [];
        
        this.gui = document.createElement('div');
        this.gui.className = 'bg-[#f8f9fa] dark:bg-[#353e4a] text-[--cm-text] flex flex-col shadow-xl rounded-md border border-[--cm-border] dark:border-gray-500 p-2';
        this.gui.style.width = '300px';
        this.gui.style.maxHeight = '380px';
        
        this.gui.innerHTML = `
            <div class="mb-3">
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-[--cm-muted]">
                        <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                    </div>
                    <input type="text" placeholder="{% translate 'Фільтр...' %}" class="w-full bg-white dark:bg-[--cm-surface] text-[--cm-text] border border-[--cm-border] dark:border-gray-500 rounded-md pl-9 pr-3 py-1.5 text-sm focus:outline-none focus:border-[--cm-muted] focus:ring-0 transition-all">
                </div>
            </div>
            <div class="flex items-center justify-between mb-3 px-1 border-b border-[--cm-border] dark:border-gray-500 pb-3">
                <div class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="selectAll-${this.field}" class="w-4 h-4 rounded border-[--cm-border] accent-gray-500 text-gray-500 focus:ring-gray-500 bg-[--cm-bg] cursor-pointer" checked>
                    <label for="selectAll-${this.field}" class="text-sm font-semibold cursor-pointer select-none text-[--cm-text]">{% translate "(Select All)" %}</label>
                </div>
                <div class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="selectNonEmpty-${this.field}" class="w-4 h-4 rounded border-[--cm-border] accent-gray-500 text-gray-500 focus:ring-gray-500 bg-[--cm-bg] cursor-pointer">
                    <label for="selectNonEmpty-${this.field}" class="text-sm font-semibold cursor-pointer select-none text-[--cm-text]">{% translate "Non empty" %}</label>
                </div>
            </div>
            <div class="filter-list flex-1 overflow-y-auto px-1 space-y-2 mt-1"></div>
        `;
        
        this.searchInput = this.gui.querySelector('input[type="text"]');
        this.selectAllCheckbox = this.gui.querySelector(`#selectAll-${this.field}`);
        this.selectNonEmptyCheckbox = this.gui.querySelector(`#selectNonEmpty-${this.field}`);
        this.listContainer = this.gui.querySelector('.filter-list');
        
        // Debounce timer for instant search filtering
        this.searchDebounceTimer = null;
        
        this.searchInput.addEventListener('input', () => {
            const searchTerm = this.searchInput.value.toLowerCase().trim();
            
            // Immediately sync underlying selected values with search results
            const filteredValues = this.allValues.filter(v => v.toLowerCase().includes(searchTerm));
            this.selectedValues.clear();
            filteredValues.forEach(v => this.selectedValues.add(v));
            this.selectAllCheckbox.checked = (this.selectedValues.size === this.allValues.length);
            this.selectNonEmptyCheckbox.checked = false;
            
            this.renderList();
            
            clearTimeout(this.searchDebounceTimer);
            this.searchDebounceTimer = setTimeout(() => {
                this.params.filterChangedCallback();
            }, 300);
        });
        
        this.selectAllCheckbox.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            if (isChecked) {
                this.allValues.forEach(v => this.selectedValues.add(v));
                this.selectNonEmptyCheckbox.checked = false;
            } else {
                this.selectedValues.clear();
            }
            this.renderList();
            this.params.filterChangedCallback();
        });
        
        this.selectNonEmptyCheckbox.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            this.selectedValues.clear();
            
            if (isChecked) {
                this.allValues.forEach(v => {
                    const tv = v.trim();
                    if (tv !== '-' && tv !== '(Empty)' && tv !== 'Не вказано' && tv !== '') {
                        this.selectedValues.add(v);
                    }
                });
                this.selectAllCheckbox.checked = false;
            } else {
                this.allValues.forEach(v => this.selectedValues.add(v));
                this.selectAllCheckbox.checked = true;
            }
            
            this.renderList();
            this.params.filterChangedCallback();
        });
    }
    
    async setupValues() {
        const valuesSet = new Set();
        
        // Read search text from the manager (quickFilterText is not used with infinite model)
        const gridId = this.params.api.getGridOption('context')?.gridId;
        const manager = gridId ? window[gridId + 'Manager'] : null;
        const qf = manager ? manager._searchText : '';
        const qfLower = qf ? String(qf).toLowerCase().trim() : "";
        
        // Don't capture isActive here, check it after the await!

        const rowModelType = this.params.api.getGridOption('rowModelType');
        const gridCtx = this.params.api.getGridOption('context');
        const dictUrl = gridCtx?.dictionaryUrl;

        // Fetch from dictionary URL if in infinite row model
        if (rowModelType === 'infinite' && dictUrl && this.allValues.length === 0) {
            try {
                this.listContainer.innerHTML = '<div class="text-[10px] text-[--cm-muted] text-center italic py-4 flex flex-col items-center"><svg class="animate-spin h-5 w-5 text-indigo-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Завантаження словника...</div>';
                
                const qs = window.location.search;
                const sep = dictUrl.includes('?') ? '&' : '?';
                let fetchUrl = `${dictUrl}${sep}field=${encodeURIComponent(this.field)}`;
                
                // Pass frontend filters to dictionary fetch (e.g. care & period)
                if (qs && qs.length > 1) {
                    const params = new URLSearchParams(qs);
                    params.delete('q'); // We will use grid's active quick filter instead
                    const extra = params.toString();
                    if (extra) {
                        fetchUrl += '&' + extra;
                    }
                }
                
                if (qfLower) {
                    fetchUrl += `&q=${encodeURIComponent(qfLower)}`;
                }
                
                const response = await fetch(fetchUrl);
                if (response.ok) {
                    const data = await response.json();
                    if (data.values && data.values.length > 0) {
                        data.values.forEach(v => {
                            const trimmed = v === null || v === undefined ? "" : String(v).trim();
                            valuesSet.add(trimmed);
                        });
                        
                        const newValues = Array.from(valuesSet).sort();
                        
                        // If no values were restored via setModel(), then populate with everything
                        if (this.selectedValues.size === 0) {
                            newValues.forEach(v => this.selectedValues.add(v));
                        }
                        
                        this.allValues = newValues;
                        this.renderList();
                        
                        // We strictly DO NOT call this.params.filterChangedCallback() here.
                        // AG Grid already calls getModel() natively during gridOptions initialization
                        // when it restores state from localStorage. Calling it manually here forces
                        // a secondary grid refresh cycle, causing a race condition and silent failures.
                        
                        return;
                    }
                }
            } catch (err) {
                console.error('Failed to load filter dictionary:', err);
            }
        }

        // If not infinite, or fallback: look at visible nodes
        if (this.selectedValues.size === 0) {
            this.params.api.forEachNodeAfterFilter(node => {
                let val;
                if (this.params.valueGetter) val = this.params.valueGetter({ node: node, data: node.data });
                if (val === undefined && node.data) val = node.data[this.field];
                valuesSet.add(val === null || val === undefined ? "" : String(val).trim());
            });
        } else {
            this.params.api.forEachNode(node => {
                if (qfLower && node.data) {
                    let matches = false;
                    for (let key in node.data) {
                        const cellVal = node.data[key];
                        if (cellVal !== null && cellVal !== undefined && String(cellVal).toLowerCase().includes(qfLower)) {
                            matches = true;
                            break;
                        }
                    }
                    if (!matches) return;
                }
                
                let val;
                if (this.params.valueGetter) val = this.params.valueGetter({ node: node, data: node.data });
                if (val === undefined && node.data) val = node.data[this.field];
                valuesSet.add(val === null || val === undefined ? "" : String(val).trim());
            });
        }

        const newValues = Array.from(valuesSet).sort();
        
        if (this.allValues.length === 0 && this.selectedValues.size === 0) {
            newValues.forEach(v => this.selectedValues.add(v));
        } else if (!isActive) {
            newValues.forEach(v => this.selectedValues.add(v));
        }
        
        this.allValues = newValues;
        this.renderList();
    }

    afterGuiAttached() {
        this.setupValues();
        setTimeout(() => this.searchInput.focus(), 50);
    }
    
    renderList() {
        const searchTerm = this.searchInput.value.toLowerCase().trim();
        this.listContainer.innerHTML = '';
        
        const filteredValues = this.allValues.filter(v => v.toLowerCase().includes(searchTerm));
        
        filteredValues.sort((a, b) => {
            const aChecked = this.selectedValues.has(a);
            const bChecked = this.selectedValues.has(b);
            if (aChecked && !bChecked) return -1;
            if (!aChecked && bChecked) return 1;
            return a.localeCompare(b);
        });
        
        if (filteredValues.length === 0) {
            this.listContainer.innerHTML = '<div class="text-[10px] text-[--cm-muted] text-center italic py-2">{% translate "No matches found" %}</div>';
            return;
        }
        
        let hasChecked = false;
        let hasUnchecked = false;

        filteredValues.forEach((val, index) => {
            const isChecked = this.selectedValues.has(val);
            
            if (isChecked) hasChecked = true;
            if (!isChecked && hasChecked && !hasUnchecked) {
                const separator = document.createElement('div');
                separator.className = 'border-t border-[--cm-border]/50 my-1.5 mx-1 transition-all';
                this.listContainer.appendChild(separator);
                hasUnchecked = true;
            }

            const safeIdSuffix = btoa(encodeURIComponent(val)).replace(/[^a-zA-Z0-9]/g, '');
            const id = `filter-${this.field}-${safeIdSuffix || 'empty'}`;
            const displayVal = val === "" ? '<span class="italic text-[--cm-muted]">{% translate "(Empty)" %}</span>' : val;
            
            const item = document.createElement('div');
            item.className = 'flex items-start gap-2 hover:bg-[--cm-hover] p-1 rounded transition-colors';
            item.innerHTML = `
                <input type="checkbox" id="${id}" class="mt-0.5 w-4 h-4 rounded border-[--cm-border] accent-gray-500 text-gray-500 focus:ring-gray-500 cursor-pointer" ${isChecked ? 'checked' : ''}>
                <label for="${id}" class="text-sm cursor-pointer select-none flex-1 leading-relaxed break-words text-[--cm-text]">${displayVal}</label>
            `;
            
            const checkbox = item.querySelector('input');
            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    this.selectedValues.add(val);
                } else {
                    this.selectedValues.delete(val);
                    this.selectAllCheckbox.checked = false;
                    this.selectNonEmptyCheckbox.checked = false;
                }
                
                if (this.selectedValues.size === this.allValues.length) {
                    this.selectAllCheckbox.checked = true;
                }
                
                this.params.filterChangedCallback();
                this.renderList();
            });
            
            this.listContainer.appendChild(item);
        });
        
        const allDisplayedSelected = filteredValues.length > 0 && filteredValues.every(v => this.selectedValues.has(v));
        // We only want the "Select All" to be checked if truly ALL values across the board are selected
        this.selectAllCheckbox.checked = this.selectedValues.size === this.allValues.length;
    }
    
    getGui() { return this.gui; }
    
    doesFilterPass(params) {
        if (!params.data) return false;
        let val;
        if (this.params.valueGetter) {
            val = this.params.valueGetter(params);
        }
        if (val === undefined && params.data) {
            val = params.data[this.field];
        }
        if (val === null || val === undefined) val = "";
        
        return this.selectedValues.has(String(val).trim());
    }
    
    isFilterActive() {
        return this.selectedValues.size !== this.allValues.length;
    }
    
    getModel() {
        if (!this.isFilterActive()) return null;
        return { values: Array.from(this.selectedValues) };
    }
    
    setModel(model) {
        if (model == null) {
            this.allValues.forEach(v => this.selectedValues.add(v));
            this.selectAllCheckbox.checked = true;
        } else {
            this.selectedValues.clear();
            model.values.forEach(v => this.selectedValues.add(v));
            this.selectAllCheckbox.checked = false;
        }
        this.renderList();
    }
}
</script>
<style>
/* Always highlight the grid column filter icon when ContextGridSmartFilter is active */
.ag-theme-quartz .ag-header-cell-filtered .ag-header-icon,
.ag-theme-quartz .ag-header-cell-filtered .ag-icon-filter,
.ag-theme-alpine .ag-header-cell-filtered .ag-header-icon,
.ag-header-cell-filtered .ag-icon-filter {
    color: #6366f1 !important;
    opacity: 1 !important;
}
</style>
