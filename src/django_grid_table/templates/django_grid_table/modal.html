{% load i18n %}
<!-- ContextGrid Modal -->
<div id="col-selector-panel-{{ grid_id }}" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-[--cm-surface] border border-[--cm-border] rounded-xl p-6 shadow-2xl flex flex-col w-full max-w-[1500px]"
         style="height: 95vh; max-width: 95vw;">
         
        <div class="flex items-center justify-between mb-4 border-b border-[--cm-border] pb-3 shrink-0 gap-6">
            <div class="text-[13px] uppercase tracking-widest text-[--cm-text] font-bold shrink-0">{% trans "Column Settings" %}</div>
            
            <div class="text-[11px] text-[--cm-muted] flex-1 text-center font-medium">
                {% trans "Drag pills to change order, L/R to pin, and save the state as a preset." %}
            </div>
            
            <div class="flex items-center gap-3 shrink-0">
                <button onclick="{{ grid_id }}Manager.resetColumnsToDefault()" class="text-[10px] bg-orange-500/10 text-orange-400 hover:bg-orange-400/20 px-2 py-1.5 rounded transition-colors focus:outline-none shadow-sm">{% trans "Reset to default" %}</button>
                <button onclick="{{ grid_id }}Manager.toggleColSelector()" class="text-[--cm-muted] hover:text-[--cm-text] text-2xl font-bold leading-none mb-0.5">&times;</button>
            </div>
        </div>

        <!-- Sortable area -->
        <div class="mb-4 flex flex-col shrink-0 border-b border-[--cm-border] pb-4">
            <div id="col-order-list-{{ grid_id }}" class="flex flex-wrap gap-1.5 min-h-[32px] p-2 bg-[--cm-bg]/30 rounded-lg border border-[--cm-border]/50">
                <!-- Пігулки -->
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-6 overflow-hidden flex-1">
            <div id="col-checkboxes-{{ grid_id }}" class="flex flex-col flex-1 h-full pr-4 overflow-y-auto overflow-x-hidden"></div>
            
            <div class="w-[240px] border-l border-[--cm-border] pl-6 flex flex-col shrink-0">
                <div class="flex items-end justify-between border-b border-[--cm-border]/50 pb-1 mb-3 shrink-0">
                    <div class="text-[11px] uppercase tracking-widest text-indigo-500 font-bold">{% trans "Column Presets" %}</div>
                </div>
                
                <div class="flex flex-col gap-2 mb-4 shrink-0">
                    <input type="text" id="preset-name-{{ grid_id }}" placeholder="{% trans 'Enter name...' %}" class="bg-[--cm-bg] border border-[--cm-border] rounded text-xs px-2 py-1.5 text-[--cm-text] w-full focus:outline-none focus:border-indigo-500">
                    <button onclick="{{ grid_id }}Manager.saveCurrentPreset()" class="text-xs bg-indigo-500 hover:bg-indigo-400 text-white px-2.5 py-1.5 rounded transition-colors w-full shadow-sm">{% trans "Save current preset" %}</button>
                </div>
                
                <div id="presets-container-{{ grid_id }}" class="flex flex-col gap-1.5 overflow-y-auto flex-1 pr-1 border border-[--cm-border]/50 rounded-lg bg-[--cm-bg]/30 p-2"></div>
            </div>
        </div>
    </div>
</div>
