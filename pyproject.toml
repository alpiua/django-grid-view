[project]
name = "django-grid-view"
version = "2.0.0a1"
description = "Declarative grid views for Django: Simple Table, AG-Grid helpers, KPI cards, ECharts, and an LLM-friendly GridViewSpec contract"
readme = "README.md"
authors = [
    { name = "Oleksii Pylypchuk", email = "alpi@keemail.me" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2,<6.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/alpiua/django-grid-view"
Repository = "https://github.com/alpiua/django-grid-view"
Documentation = "https://alpiua.github.io/django-grid-view/"
Issues = "https://github.com/alpiua/django-grid-view/issues"
Changelog = "https://github.com/alpiua/django-grid-view/blob/main/CHANGELOG.md"

[project.scripts]
gridviewspec-mcp = "grid_view_spec.mcp.server:main"
grid-view-spec-mcp = "grid_view_spec.mcp.server:main"  # deprecated alias
django-grid-view-mcp = "grid_view_spec.mcp.server:main"  # deprecated alias

[project.optional-dependencies]
django = ["django>=4.2,<6.0"]
mcp = ["fastmcp>=2.0.0"]
starlette = ["starlette>=0.40"]
fastapi = ["fastapi>=0.115", "starlette>=0.40"]
static-charts = ["matplotlib>=3.8"]
pdf = ["weasyprint>=62", "jinja2>=3.1"]
xlsx = ["xlsxwriter>=3.2.0"]
xlsx-all = ["xlsxwriter>=3.2.0", "openpyxl>=3.1"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# Mirror of [dependency-groups] dev — for pip install django-grid-view[dev,mcp]
dev = [
    "basedpyright>=1.28.0",
    "build>=1.2.0",
    "django-stubs>=5.1.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "matplotlib-stubs>=0.3.11",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "openpyxl>=3.1",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "jsonschema>=4.23.0",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "typing_extensions>=4.12.0",
    "weasyprint>=62",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "build>=1.2.0",
    "django-stubs>=5.1.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "matplotlib-stubs>=0.3.11",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "openpyxl>=3.1",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "jsonschema>=4.23.0",
    "fastmcp>=2.0.0",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "typing_extensions>=4.12.0",
    "weasyprint>=62",
    "xlsxwriter>=3.2.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
django_grid_view = [
    "py.typed",
    "templates/**/*.html",
    "locale/**/*.po",
    "locale/**/*.mo",
    "static/**/*",
]
grid_view_spec = ["py.typed", "templates/**/*.html", "schema/*.json"]

[tool.pytest.ini_options]
addopts = "--ds=tests.settings"
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "compatibility: legacy 1.x API tests kept during Phase 11 migration window",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["*/migrations/*"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.basedpyright]
include = ["src/django_grid_view", "src/grid_view_spec", "tests"]
exclude = ["**/migrations/**", "**/__pycache__/**", "hooks/**", "**/backends/starlette/**", "tests/test_gridviewspec_*.py", "tests/gridviewspec_fixtures.py", "tests/phase11_compat.py"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false
stubPath = "typings"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
