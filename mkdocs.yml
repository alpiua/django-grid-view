site_name: Grid View Spec
site_description: GridViewSpec — declarative page layout, tables, KPI, charts; optional Django backend
site_url: https://alpiua.github.io/grid-view-spec/
repo_url: https://github.com/alpiua/grid-view-spec
repo_name: alpiua/grid-view-spec
edit_uri: edit/main/docs/

strict: true

exclude_docs: |
  llm/grid-view-spec-llm-context.md

hooks:
  - hooks/copy_llm_bundle.py

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture overview: concepts/overview.md
      - Data vs spec: concepts/data-vs-spec.md
      - Backends: concepts/backends.md
  - Spec contract:
      - GridViewSpec: spec/index.md
      - Layout: spec/layout.md
      - Validation and wire: spec/validation.md
  - Blocks:
      - Catalog: blocks/index.md
      - Composer checklist: blocks/composer.md
      - Header and navigation: blocks/header-nav.md
      - Toolbar, filters, actions: blocks/toolbar-filters-actions.md
      - Forms: blocks/forms.md
      - Overlays and tabs: blocks/overlays-tabs.md
      - Template and content: blocks/template-content.md
      - Content callout and banner: blocks/content-callout.md
  - Tables:
      - Overview: tables/index.md
      - Simple table: tables/simple-table.md
      - AG-Grid: tables/ag-grid.md
      - Columns and renderers: tables/columns.md
      - Inline editing: tables/editing.md
      - Column settings: tables/settings.md
  - Filtering:
      - Semantics: filtering/semantics.md
      - Server filtering: filtering/server.md
  - Visualization:
      - KPI and charts: visualization/kpi-charts.md
      - Cards and gallery: visualization/cards-gallery.md
  - Integration:
      - Host contract: integration/host-contract.md
      - Django: integration/django.md
      - Assets and HTMX: integration/htmx-assets.md
      - JavaScript runtime: integration/runtime.md
  - Export:
      - Page pattern: export/page-pattern.md
      - PDF: export/pdf.md
      - XLSX: export/xlsx.md
  - Persistence:
      - Saved preferences: persistence/preferences.md
  - Tools:
      - MCP server: tools/mcp-server.md
      - Chat visualizer: tools/chat-visualizer.md
  - Reference:
      - Python types: reference/python-types.md
      - Template tags: reference/template-tags.md
      - JavaScript API: reference/javascript.md
      - JSON Schema: reference/json-schema.md
  - Guides:
      - Internationalization: guides/i18n.md
      - Host dependency policy: guides/host-dependency-policy.md
  - Architecture (maintainers): maintainers/gridviewspec-architecture.md
  - Changelog: changelog.md
  - LLM context:
      - Download bundle: llm/context.md
      - Agent skill: llm/skill.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alpiua/grid-view-spec
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/grid-view-spec/
