schema: acdd/kilo-adapter/v1
inheritance:
  baseID: acdd/kilo-base/v1
  extensions: [AGENTS.md, docs/maintainers/gridviewspec-architecture.md]
repository:
  id: grid-view-spec
  root: .
roles:
  coordinator: { agent: acdd, permissions: &work-permissions [{ permission: lean-ctx_*, pattern: "*", action: allow }, { permission: codebase-memory-mcp_*, pattern: "*", action: allow }] }
  contractVerifier: { agent: code-reviewer, model: { providerID: openai, modelID: gpt-5.6-terra, variant: xhigh }, permissions: &audit-permissions [{ permission: lean-ctx_ctx_read, pattern: "*", action: allow }, { permission: lean-ctx_ctx_tree, pattern: "*", action: allow }, { permission: lean-ctx_ctx_expand, pattern: "*", action: allow }, { permission: codebase-memory-mcp_*, pattern: "*", action: allow }] }
  builder: { agent: code, model: { providerID: openai, modelID: gpt-5.6-luna, variant: high }, permissions: &builder-permissions [{ permission: edit, pattern: "tests/**", action: deny }, { permission: write, pattern: "tests/**", action: deny }, { permission: apply_patch, pattern: "tests/**", action: deny }, { permission: lean-ctx_*, pattern: "*", action: allow }, { permission: codebase-memory-mcp_*, pattern: "*", action: allow }] }
  testAuthor:
    agent: code
    model: { providerID: openai, modelID: gpt-5.6-luna, variant: xhigh }
    permissions: &test-author-permissions
      - { permission: edit, pattern: "src/**", action: deny }
      - { permission: write, pattern: "src/**", action: deny }
      - { permission: apply_patch, pattern: "src/**", action: deny }
      - { permission: edit, pattern: "frontend/**", action: deny }
      - { permission: write, pattern: "frontend/**", action: deny }
      - { permission: apply_patch, pattern: "frontend/**", action: deny }
      - { permission: edit, pattern: "schema/**", action: deny }
      - { permission: write, pattern: "schema/**", action: deny }
      - { permission: apply_patch, pattern: "schema/**", action: deny }
      - { permission: lean-ctx_*, pattern: "*", action: allow }
      - { permission: codebase-memory-mcp_*, pattern: "*", action: allow }
  finalReviewers:
    - { agent: code-reviewer, model: { providerID: openai, modelID: gpt-5.6-sol, variant: low }, permissions: *work-permissions }
    - { agent: code-reviewer, model: { providerID: openai, modelID: gpt-5.6-terra, variant: medium }, permissions: *work-permissions }
    - { agent: code-reviewer, model: { providerID: openai, modelID: gpt-5.6-luna, variant: high }, permissions: *work-permissions }
  synthesizer: { agent: orchestrator, model: { providerID: openai, modelID: gpt-5.6-sol, variant: medium }, permissions: *audit-permissions }
proof:
  defaultStrategy: deferred-final-test
  sensitivityRequired: true
paths:
  production: [src, frontend, schema]
  tests: [tests]
  documentation: [AGENTS.md, README.md, docs]
commands:
  build:
    - id: focused-test
      argv: [uv, run, pytest, "{target}", -q, "--tb=line"]
      cwd: .
      timeoutSeconds: 900
      maxOutputBytes: 300000
  handoff:
    - id: ci-gate
      argv: [./scripts/ci-gate.sh]
      cwd: .
      timeoutSeconds: 1800
      maxOutputBytes: 500000
risk:
  localReviewWhen: [public-schema-export-or-host-boundary-change]
  liveChecks: []
guidance:
  architecture: docs/maintainers/gridviewspec-architecture.md
  quality: AGENTS.md
  finalTests: AGENTS.md
capabilities:
  structured-output: required
  event-completion: required
